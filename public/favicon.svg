<!--
  Thalify favicon — sage thali brand mark.
  Outer sage-green disc, white plate inside with three dishes:
    - large solid katori (top)
    - large solid katori (bottom-left)
    - small katori with green seed (bottom-right)
    - rice-bowl oval outline (bottom-center)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Dark sage outer disc -->
  <circle cx="32" cy="32" r="32" fill="#2C5E37"/>

  <!-- White thali rim -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#F5F1E8" stroke-width="3"/>

  <!-- White plate fill -->
  <circle cx="32" cy="32" r="18.5" fill="#F5F1E8"/>

  <!-- Inner sage edge of plate -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#2C5E37" stroke-width="1.2"/>

  <!-- Top katori (solid) -->
  <circle cx="32" cy="22" r="3.7" fill="#2C5E37"/>

  <!-- Bottom-left katori (solid, slightly larger) -->
  <circle cx="25.5" cy="32" r="4.5" fill="#2C5E37"/>

  <!-- Bottom-right katori (outlined, with green seed in center) -->
  <circle cx="40.5" cy="34.5" r="3.6" fill="#F5F1E8" stroke="#2C5E37" stroke-width="1.3"/>
  <circle cx="40.5" cy="34.5" r="1.2" fill="#3A9D5C"/>

  <!-- Bottom rice-bowl oval -->
  <ellipse cx="32" cy="43.5" rx="5" ry="1.8" fill="none" stroke="#2C5E37" stroke-width="1.4"/>
</svg>
