<!--
  Thalify favicon — the brand "thali" mark.
  Concentric rings (a metal thali plate) with a haldi (turmeric) dot
  at the center. Designed to read clearly down to 16x16.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Cream rounded-square background -->
  <rect width="32" height="32" rx="7" fill="#FAF6EE"/>
  <!-- Outer thali rim -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#1A1714" stroke-width="1.6"/>
  <!-- Inner ring (solid for clarity at small sizes) -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#1A1714" stroke-width="1.1" opacity="0.6"/>
  <!-- Haldi (turmeric) center dot -->
  <circle cx="16" cy="16" r="3.6" fill="#EFB643" stroke="#1A1714" stroke-width="1"/>
</svg>
